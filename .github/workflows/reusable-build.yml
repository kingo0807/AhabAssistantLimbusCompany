name: Reusable Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 签出代码
      - name: Checkout
        uses: actions/checkout@main

      # 配置 uv 
      - name: Setup UV for Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock

      # 安装依赖
      - name: Install dependencies
        run: |
          uv sync --frozen
      
      # 构建并打包程序
      - name: build & bundle
        run: |
          uv run python ./scripts/build.py --version ${{ inputs.version }}

      # 生成增量更新补丁：对照线上当前发布版本算差异。
      # 拿不到上一版、或新旧无差异时脚本自己跳过并返回 0，绝不让全量构建失败。
      - name: build incremental patch
        continue-on-error: true
        env:
          # Windows runner 默认 cp1252，中文日志会让脚本直接崩
          PYTHONUTF8: "1"
        run: |
          uv run python ./scripts/build_incremental.py --new "dist/AALC_${{ inputs.version }}.7z" --out-dir dist --verify

      # 上传打包结果（archive:false 只允许单文件，所以补丁单独一个产物）
      - name: Upload build artifacts
        uses: actions/upload-artifact@main
        with:
          name: AALC_${{ inputs.version }}
          path: |
            dist/AALC_${{ inputs.version }}.7z
          archive: false

      # 补丁包 + 元数据。archive 保持默认（打包成 zip），多文件才能一起传。
      - name: Upload incremental patch
        uses: actions/upload-artifact@main
        with:
          name: AALC_${{ inputs.version }}.patch
          path: |
            dist/AALC_${{ inputs.version }}.patch.7z
            dist/AALC_${{ inputs.version }}.patch.json
          if-no-files-found: warn
