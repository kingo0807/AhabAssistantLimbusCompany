name: Build (manual)

# 推到 dev 分支或手动触发 → 构建 → 自动发布 dist-<版本> release。
# 这个 release 是自建更新源的分发源：家里 KVM / 公网 VM 上的 aalc-sync 定时器
# 会拉取 dist-* 里版本最高的那个，校验 sha256 后同步到本地分发目录。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（写进 assets/config/version.txt）"
        required: true
        default: "V1.6.10-dev"
  push:
    branches:
      - dev-custom-update

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      version: ${{ inputs.version || 'V1.6.10-dev' }}

  publish-dist:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@main

      # 全量包（archive:false）和补丁包的 zip 都会解到 dist/
      - name: Download build artifacts
        uses: actions/download-artifact@main
        with:
          path: dist
          merge-multiple: true

      - name: Generate latest.json
        run: |
          python3 scripts/make_latest_json.py \
            --version "${{ inputs.version || 'V1.6.10-dev' }}" \
            --dir dist \
            --notes-file release_notes.txt

      # 同版本重跑时先删旧 release，避免 asset 重名 422
      - name: Publish dist release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || 'V1.6.10-dev' }}
        run: |
          set -euo pipefail
          tag="dist-${VERSION}"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AALC ${VERSION}（自建分发）" \
            --notes-file release_notes.txt \
            --prerelease \
            --latest=false \
            dist/AALC_*.7z dist/AALC_*.patch.json dist/latest.json
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
